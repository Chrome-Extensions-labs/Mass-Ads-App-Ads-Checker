<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ads & App-Ads Checker</title>
  <link rel="stylesheet" href="assets/css/popup.css">
</head>
<body>
  <header class="app-header">
    <div class="app-title-wrap">
      <h1 class="app-title">Lines Checker</h1>
      <a href="https://github.com/Chrome-Extensions-labs/Mass-Ads-App-Ads-Checker" class="version-badge" target="_blank" rel="noopener noreferrer">GitHub</a>
    </div>
    <div class="header-actions">
      <div class="mode-switch" role="tablist" aria-label="Scan mode">
        <button id="standardModeBtn" class="mode-btn" role="tab" aria-selected="true">Standard</button>
        <button id="bulkModeBtn" class="mode-btn" role="tab" aria-selected="false">Bulk</button>
      </div>
      <button id="themeToggleBtn" class="icon-btn" aria-label="Toggle dark theme" title="Toggle dark theme">
        <span class="theme-icon-sun" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        </span>
        <span class="theme-icon-moon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </span>
      </button>
    </div>
  </header>

  <section class="config-panel" aria-label="Scan configuration">
    <div class="control-group">
      <label for="fileTypeSelect">File type</label>
      <select id="fileTypeSelect">
        <option value="app-ads.txt">app-ads.txt</option>
        <option value="ads.txt">ads.txt</option>
        <option value="both">ads.txt + app-ads.txt</option>
        <option value="url">Exact URL</option>
      </select>
    </div>

    <div id="standardConcurrencyWrap" class="control-group concurrency-wrap">
      <label for="standardConcurrencyInput" title="Number of domains checked at the same time. Higher values are faster but may cause memory pressure or trigger anti-bot rate limits on some networks. Recommended: 5–15.">Parallel requests <span class="hint">?</span></label>
      <input id="standardConcurrencyInput" type="number" min="1" max="20" step="1" inputmode="numeric">
    </div>

    <div id="bulkConcurrencyWrap" class="control-group concurrency-wrap hidden-view">
      <label for="bulkConcurrencyInput" title="Number of domains checked at the same time. Higher values are faster but may cause memory pressure or trigger anti-bot rate limits on some networks. Recommended: 5–15.">Parallel requests <span class="hint">?</span></label>
      <input id="bulkConcurrencyInput" type="number" min="1" max="20" step="1" inputmode="numeric">
    </div>

    <div id="standardLoadGroup" class="button-group">
      <input type="file" id="fileInput" accept=".txt" class="hidden-input">
      <button id="loadFileBtn" class="btn btn-secondary">Load TXT</button>
      <input type="file" id="csvFileInput" accept=".csv,.txt" class="hidden-input">
      <button id="loadCsvBtn" class="btn btn-secondary">Load CSV</button>
    </div>

    <div id="bulkLoadGroup" class="button-group hidden-view">
      <input type="file" id="bulkFileInput" accept=".txt" class="hidden-input">
      <button id="bulkLoadFileBtn" class="btn btn-secondary">Load file</button>
      <label class="compact-inline" for="bulkInputTypeSelect">Input</label>
      <select id="bulkInputTypeSelect" class="compact-select">
        <option value="txt" selected>TXT</option>
        <option value="csv">CSV</option>
      </select>
      <label class="compact-inline" for="bulkFileTypeSelect">File type</label>
      <select id="bulkFileTypeSelect" class="compact-select">
        <option value="app-ads.txt">app-ads.txt</option>
        <option value="ads.txt">ads.txt</option>
        <option value="both">ads.txt + app-ads.txt</option>
        <option value="url">Exact URL</option>
      </select>

      <label class="bulk-status-toggle" for="bulkIncludeStatus">
        <input type="checkbox" id="bulkIncludeStatus" checked>
        Include status in CSV
      </label>
    </div>

    <div class="run-slot">
      <button id="checkBtn" class="btn btn-primary" aria-label="Run standard check">Run Check</button>
      <button id="stopBtn" class="btn btn-stop" aria-label="Stop standard check">Stop</button>
      <button id="bulkCheckBtn" class="btn btn-primary hidden-view" aria-label="Start bulk check" disabled>Start Bulk Check</button>
      <button id="bulkStopBtn" class="btn btn-stop" aria-label="Stop bulk check">Stop</button>
    </div>
  </section>

  <section class="progress-strip" aria-live="polite">
    <div class="progress-track">
      <div id="progressBarFill" class="progress-fill"></div>
    </div>
    <div id="progressMeta" class="progress-meta">Processed: 0 / 0 · Elapsed: 00:00 · ETA: 00:00 · Status: Ready</div>
  </section>

  <main>
    <section id="standardModeView">
      <div class="input-zone">
        <label for="domainList">Domains / URLs</label>
        <div class="textarea-wrap">
          <textarea id="domainList" placeholder="Enter domains here or load from TXT/CSV file..."></textarea>
          <span id="domainCountChip" class="domain-chip">0 domains</span>
        </div>
      </div>

      <div class="results-zone">
        <div class="table-container">
          <table id="resultsTable">
            <thead>
              <tr>
                <th class="col-url">File URL</th>
                <th class="col-status">Status</th>
                <th class="col-lines">Lines</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </div>

      <div class="footer-actions">
        <button id="downloadBtn" class="btn btn-outline">Download CSV</button>
      </div>
    </section>

    <section id="bulkModeView" class="hidden-view">
      <div class="bulk-file-status-wrap">
        <span id="bulkFileStatus" class="bulk-file-status">No file selected</span>
      </div>

      <div class="stats-grid">
        <article class="stat-card">
          <div class="stat-title">Processed</div>
          <div class="stat-value" id="bulkProgressValue">0 / 0</div>
        </article>
        <article class="stat-card">
          <div class="stat-title">Elapsed</div>
          <div class="stat-value" id="bulkTimeValue">00:00</div>
        </article>
        <article class="stat-card">
          <div class="stat-title">ETA</div>
          <div class="stat-value" id="bulkEtaValue">00:00</div>
        </article>
      </div>

      <div class="footer-actions">
        <button id="bulkDownloadBtn" class="btn btn-outline">Download CSV</button>
        <button id="bulkDownloadTxtBtn" class="btn btn-outline">Download TXT</button>
      </div>
    </section>
  </main>

  <div class="oss-bar">
    <span class="oss-bar__text">Open-source project:</span>
    <a class="oss-bar__link" href="https://github.com/Chrome-Extensions-labs/Mass-Ads-App-Ads-Checker" target="_blank" rel="noopener noreferrer">
      GitHub
      <svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>

  <script src="assets/js/popup.js"></script>
</body>
</html>
